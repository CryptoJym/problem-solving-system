    <text x="689" y="705" font-size="22" font-weight="560" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="689" dy="0">Users report login bugs. Session replay shows</tspan><tspan x="689" dy="27.72">the real issue is an OAuth redirect loop after</tspan><tspan x="689" dy="27.72">expired sessions.</tspan></text>

