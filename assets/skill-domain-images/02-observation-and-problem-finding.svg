    <rect x="70" y="625" width="545" height="165" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
    <rect x="70" y="625" width="545" height="46" rx="18" fill="#0891b2" opacity="0.94"/>
