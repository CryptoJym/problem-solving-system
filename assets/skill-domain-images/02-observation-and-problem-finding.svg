    <text x="94" y="705" font-size="22" font-weight="560" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="94" dy="0">Support tickets blame training. Call shadowing</tspan><tspan x="94" dy="27.72">shows the billing screen forces duplicate entry</tspan><tspan x="94" dy="27.72">and creates mistakes.</tspan></text>


