  <text x="170" y="94" font-size="39" font-weight="900" fill="#111827" font-family="Inter, ui-sans-serif, system-ui">Observation and Problem Finding</text>
  <text x="172" y="135" font-size="23" font-weight="560" fill="#263244" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="172" dy="0">Use when: There are many possible problems and the team is relying on</tspan><tspan x="172" dy="28.52">secondhand reports.</tspan></text>

  <text x="70" y="246" font-size="25" font-weight="900" fill="#111827" font-family="Inter, ui-sans-serif, system-ui">How it works: four clean workflow frames</text>
