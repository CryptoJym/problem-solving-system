      <path d="M 120 86 L 145 103 M 171 102 L 194 80" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
    </g><path d="M 876 608 H 1104" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.14"/></g>
      <text x="850" y="665" text-anchor="start" font-size="17" font-weight="900" fill="#7c3aed" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="850" dy="0">Cause chain</tspan></text>
      <text x="850" y="692" text-anchor="start" font-size="17" font-weight="650" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="850" dy="0">Waiting causes delay.</tspan></text>
    </g>

    <g class="frame-card">
