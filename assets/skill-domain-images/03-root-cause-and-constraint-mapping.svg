      <text x="131" y="343" text-anchor="middle" font-size="13" font-weight="900" fill="#7c3aed" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui">STEP 1</text>
      <circle cx="119" cy="396" r="27" fill="#7c3aed"/>
      <text x="119" y="406" text-anchor="middle" font-size="25" font-weight="900" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">1</text>
      <text x="162" y="388" text-anchor="start" font-size="25" font-weight="880" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="162" dy="0">Name goal</tspan></text>
      <g class="step-art"><rect x="100" y="450" width="280" height="184" rx="22" fill="#ede9fe" opacity="0.72"/><g transform="translate(100, 450)">

    <circle cx="49" cy="119" r="9.600000000000001" fill="#7c3aed" opacity="0.92"/>
    <path d="M 30.599999999999998 155 Q 49 136.6 67.4 155" fill="#7c3aed" opacity="0.18" stroke="#7c3aed" stroke-width="2.4000000000000004"/>


    <rect x="83" y="34" width="148" height="98" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.48" stroke-width="4"/>


