      <circle cx="157" cy="84" r="18" fill="none" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="4"/>
      <circle cx="157" cy="84" r="7" fill="#7c3aed"/>
    </g><path d="M 126 608 H 354" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.14"/></g>
      <text x="100" y="665" text-anchor="start" font-size="17" font-weight="900" fill="#7c3aed" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="100" dy="0">Clear goal</tspan></text>
      <text x="100" y="692" text-anchor="start" font-size="17" font-weight="650" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="100" dy="0">Ship on time.</tspan></text>
    </g>

    <g class="frame-card">
