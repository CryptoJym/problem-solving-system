      <path d="M 143 84 H 173" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g><path d="M 1251 608 H 1479" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.14"/></g>
      <text x="1225" y="665" text-anchor="start" font-size="17" font-weight="900" fill="#7c3aed" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="1225" dy="0">Slowest point</tspan></text>
      <text x="1225" y="692" text-anchor="start" font-size="17" font-weight="650" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="1225" dy="0">Approval blocks flow.</tspan></text>
