      <text x="537" y="388" text-anchor="start" font-size="25" font-weight="880" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="537" dy="0">List bad effects</tspan></text>
      <g class="step-art"><rect x="475" y="450" width="280" height="184" rx="22" fill="#ede9fe" opacity="0.72"/><g transform="translate(475, 450)">

    <circle cx="49" cy="119" r="9.600000000000001" fill="#7c3aed" opacity="0.92"/>
    <path d="M 30.599999999999998 155 Q 49 136.6 67.4 155" fill="#7c3aed" opacity="0.18" stroke="#7c3aed" stroke-width="2.4000000000000004"/>


    <rect x="83" y="34" width="148" height="98" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.48" stroke-width="4"/>


      <circle cx="111" cy="68" r="6" fill="#7c3aed"/>
      <circle cx="111" cy="91" r="6" fill="#7c3aed" opacity="0.65"/>
      <circle cx="111" cy="114" r="6" fill="#7c3aed" opacity="0.4"/>
      <path d="M 128 68 H 199 M 128 91 H 189 M 128 114 H 204" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3"/>
    </g><path d="M 501 608 H 729" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.14"/></g>
      <text x="475" y="665" text-anchor="start" font-size="17" font-weight="900" fill="#7c3aed" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="475" dy="0">What goes wrong</tspan></text>
      <text x="475" y="692" text-anchor="start" font-size="17" font-weight="650" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="475" dy="0">Late, rework, refunds.</tspan></text>
    </g>

    <g class="frame-card">
