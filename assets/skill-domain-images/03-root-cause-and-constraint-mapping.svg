      <rect x="467" y="322" width="78" height="30" rx="15" fill="#7c3aed" opacity="0.12"/>
      <text x="506" y="343" text-anchor="middle" font-size="13" font-weight="900" fill="#7c3aed" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui">STEP 2</text>
      <circle cx="494" cy="396" r="27" fill="#7c3aed"/>
