      <rect x="1217" y="322" width="78" height="30" rx="15" fill="#7c3aed" opacity="0.12"/>
      <text x="1256" y="343" text-anchor="middle" font-size="13" font-weight="900" fill="#7c3aed" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui">STEP 4</text>
      <circle cx="1244" cy="396" r="27" fill="#7c3aed"/>
      <text x="1244" y="406" text-anchor="middle" font-size="25" font-weight="900" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">4</text>
      <text x="1287" y="388" text-anchor="start" font-size="25" font-weight="880" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="1287" dy="0">Find bottleneck</tspan></text>
      <g class="step-art"><rect x="1225" y="450" width="280" height="184" rx="22" fill="#ede9fe" opacity="0.72"/><g transform="translate(1225, 450)">

    <circle cx="49" cy="119" r="9.600000000000001" fill="#7c3aed" opacity="0.92"/>
    <path d="M 30.599999999999998 155 Q 49 136.6 67.4 155" fill="#7c3aed" opacity="0.18" stroke="#7c3aed" stroke-width="2.4000000000000004"/>


    <rect x="82" y="39" width="150" height="90" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.48" stroke-width="4"/>


