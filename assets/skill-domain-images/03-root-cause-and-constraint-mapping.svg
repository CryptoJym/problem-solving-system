    <text x="94" y="831" font-size="20" font-weight="850" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">Business example</text>
    <text x="712" y="831" text-anchor="end" font-size="15" font-weight="850" fill="#ffffff" opacity="0.88" font-family="Inter, ui-sans-serif, system-ui">scenario</text>
    <text x="94" y="884" text-anchor="start" font-size="21" font-weight="620" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="94" dy="0">Business: late orders come from approval delay, not</tspan><tspan x="94" dy="26.25">packing speed.</tspan></text>


    <rect x="840" y="800" width="690" height="172" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
