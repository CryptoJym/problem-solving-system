    <text x="94" y="691" font-size="20" font-weight="800" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">Business example</text>
    <text x="570" y="691" text-anchor="end" font-size="15" font-weight="800" fill="#ffffff" opacity="0.88" font-family="Inter, ui-sans-serif, system-ui">scenario</text>
    <text x="94" y="742" text-anchor="start" font-size="22" font-weight="560" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="94" dy="0">Orders ship late. Mapping shows the real</tspan><tspan x="94" dy="27.72">constraint is a once-daily approval batch, not</tspan><tspan x="94" dy="27.72">warehouse speed.</tspan></text>


    <rect x="665" y="660" width="545" height="176" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
    <rect x="665" y="660" width="545" height="46" rx="18" fill="#7c3aed" opacity="0.94"/>
    <text x="689" y="691" font-size="20" font-weight="800" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">Coding example</text>
    <text x="1165" y="691" text-anchor="end" font-size="15" font-weight="800" fill="#ffffff" opacity="0.88" font-family="Inter, ui-sans-serif, system-ui">scenario</text>
    <text x="689" y="742" text-anchor="start" font-size="22" font-weight="560" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="689" dy="0">Deploys fail randomly. Causal mapping shows</tspan><tspan x="689" dy="27.72">flaky tests depend on shared mutable seed data</tspan><tspan x="689" dy="27.72">across jobs.</tspan></text>

