      <text x="912" y="388" text-anchor="start" font-size="25" font-weight="880" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="912" dy="0">Connect causes</tspan></text>
      <g class="step-art"><rect x="850" y="450" width="280" height="184" rx="22" fill="#ede9fe" opacity="0.72"/><g transform="translate(850, 450)">

