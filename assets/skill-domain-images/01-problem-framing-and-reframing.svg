    <text x="864" y="884" text-anchor="start" font-size="21" font-weight="620" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="864" dy="0">One checkout endpoint is slow; rewriting the whole API is</tspan><tspan x="864" dy="26.25">premature.</tspan></text>

