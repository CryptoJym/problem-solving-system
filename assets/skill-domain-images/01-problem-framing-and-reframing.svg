<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">01 Problem Framing and Reframing</title>
  <desc id="desc">Workflow diagram with business and coding examples for Problem Framing and Reframing.</desc>
  <rect width="1280" height="760" fill="#f8fafc"/>
  <rect x="34" y="34" width="1212" height="692" rx="28" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <rect x="34" y="34" width="1212" height="164" rx="28" fill="#dbeafe"/>
  <circle cx="103" cy="112" r="44" fill="#2563eb"/>
  <text x="103" y="125" text-anchor="middle" font-size="34" font-weight="900" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">01</text>
  <text x="170" y="94" font-size="39" font-weight="900" fill="#111827" font-family="Inter, ui-sans-serif, system-ui">Problem Framing and Reframing</text>
  <text x="172" y="135" font-size="23" font-weight="560" fill="#263244" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="172" dy="0">Use when: The problem statement is vague, political, solution-shaped, or stuck</tspan><tspan x="172" dy="28.52">on symptoms.</tspan></text>

  <text x="70" y="256" font-size="24" font-weight="900" fill="#111827" font-family="Inter, ui-sans-serif, system-ui">How it works</text>
  
    <rect x="70" y="286" width="225" height="88" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="104" cy="330" r="18" fill="#2563eb"/>
    <text x="104" y="337" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">1</text>
    <text x="136" y="324" font-size="20" font-weight="750" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="136" dy="0">Current complaint</tspan></text>
  
    <rect x="350" y="286" width="225" height="88" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="384" cy="330" r="18" fill="#2563eb"/>
    <text x="384" y="337" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">2</text>
    <text x="416" y="324" font-size="20" font-weight="750" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="416" dy="0">Remove hidden fix</tspan></text>
  
    <rect x="630" y="286" width="225" height="88" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="664" cy="330" r="18" fill="#2563eb"/>
    <text x="664" y="337" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">3</text>
    <text x="696" y="324" font-size="20" font-weight="750" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="696" dy="0">Reframe</tspan><tspan x="696" dy="23.2">goal/system</tspan></text>
  
    <rect x="910" y="286" width="225" height="88" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="944" cy="330" r="18" fill="#2563eb"/>
    <text x="944" y="337" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">4</text>
    <text x="976" y="324" font-size="20" font-weight="750" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="976" dy="0">Ask evidence</tspan><tspan x="976" dy="23.2">question</tspan></text>
  
  <path d="M 302 330 L 336 330" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M 330 322 L 342 330 L 330 338" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 582 330 L 616 330" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M 610 322 L 622 330 L 610 338" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
