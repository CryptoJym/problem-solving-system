    <text x="94" y="884" text-anchor="start" font-size="21" font-weight="620" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="94" dy="0">Sales demos stall after handoff; hiring is the hidden fix,</tspan><tspan x="94" dy="26.25">not the problem.</tspan></text>


