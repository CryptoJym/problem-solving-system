  <text x="176" y="98" font-size="43" font-weight="900" fill="#111827" font-family="Inter, ui-sans-serif, system-ui">Problem Framing and Reframing</text>
  <text x="178" y="142" text-anchor="start" font-size="24" font-weight="610" fill="#263244" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="178" dy="0">Use when: The problem sounds vague, emotional, or already includes a fix.</tspan></text>

  <text x="70" y="256" font-size="27" font-weight="900" fill="#111827" font-family="Inter, ui-sans-serif, system-ui">How it works: concrete example flow, 1 -> 2 -> 3 -> 4</text>

