  <path d="M 890 322 L 902 330 L 890 338" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  
    <rect x="70" y="440" width="545" height="165" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
    <rect x="70" y="440" width="545" height="46" rx="18" fill="#2563eb" opacity="0.94"/>
    <text x="94" y="471" font-size="20" font-weight="800" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">Business example</text>
    <text x="570" y="471" text-anchor="end" font-size="15" font-weight="800" fill="#ffffff" opacity="0.88" font-family="Inter, ui-sans-serif, system-ui">scenario</text>
    <text x="94" y="520" font-size="22" font-weight="560" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="94" dy="0">Sales says: hire more reps. Reframe: qualified</tspan><tspan x="94" dy="27.72">leads stall because handoffs between marketing</tspan><tspan x="94" dy="27.72">and sales are unclear.</tspan></text>
  
  
    <rect x="665" y="440" width="545" height="165" rx="18" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
    <rect x="665" y="440" width="545" height="46" rx="18" fill="#2563eb" opacity="0.94"/>
    <text x="689" y="471" font-size="20" font-weight="800" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui">Coding example</text>
    <text x="1165" y="471" text-anchor="end" font-size="15" font-weight="800" fill="#ffffff" opacity="0.88" font-family="Inter, ui-sans-serif, system-ui">scenario</text>
    <text x="689" y="520" font-size="22" font-weight="560" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="689" dy="0">Team says: rewrite the API. Reframe: one</tspan><tspan x="689" dy="27.72">endpoint slows only when cache misses force</tspan><tspan x="689" dy="27.72">repeated database reads.</tspan></text>
  
  <rect x="70" y="644" width="1140" height="48" rx="14" fill="#f8fafc" stroke="#e5edf6"/>
  <text x="94" y="675" font-size="19" font-weight="900" fill="#2563eb" font-family="Inter, ui-sans-serif, system-ui">Output</text>
  <text x="174" y="675" font-size="19" font-weight="650" fill="#263244" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="174" dy="0">Testable frame, explicit goal, removed assumptions, next evidence needed.</tspan></text>
