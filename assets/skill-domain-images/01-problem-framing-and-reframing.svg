      <text x="1287" y="388" text-anchor="start" font-size="25" font-weight="880" fill="#172033" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="1287" dy="0">Check proof</tspan></text>
