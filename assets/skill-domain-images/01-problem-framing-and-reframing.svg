      <text x="1225" y="692" text-anchor="start" font-size="17" font-weight="650" fill="#243047" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><tspan x="1225" dy="0">Where is the stall?</tspan></text>
