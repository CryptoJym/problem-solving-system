      <text x="131" y="343" text-anchor="middle" font-size="13" font-weight="900" fill="#2563eb" letter-spacing="0" font-family="Inter, ui-sans-serif, system-ui">STEP 1</text>
      <circle cx="119" cy="396" r="27" fill="#2563eb"/>
